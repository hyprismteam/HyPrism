name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build: linux, windows, macos, or all'
        required: false
        default: 'all'
        type: string
      version:
        description: 'Artifact version. Defaults to the tag or CI run number'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      platforms:
        description: 'Platforms to build: linux, windows, macos, or all'
        required: false
        default: 'all'
        type: string
      version:
        description: 'Artifact version. Defaults to the tag or CI run number'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  linux:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ inputs.version }}

  windows:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ inputs.version }}

  macos:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ inputs.version }}
