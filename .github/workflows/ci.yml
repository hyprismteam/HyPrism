name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'Docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core
    uses: ./.github/workflows/test-core.yml

  mesh:
    name: Mesh
    uses: ./.github/workflows/test-mesh.yml

  desktop:
    name: Desktop
    uses: ./.github/workflows/test-desktop.yml

  local-node:
    name: Local Node
    uses: ./.github/workflows/test-local-node.yml

  packaging:
    name: Packaging
    uses: ./.github/workflows/build.yml
    with:
      platforms: all
