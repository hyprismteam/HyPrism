name: Build macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version. Defaults to the tag or CI run number'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Artifact version. Defaults to the tag or CI run number'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'

jobs:
  build:
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Determine artifact version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [[ "$GITHUB_REF_NAME" == v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              VERSION="ci-${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish macOS ARM64 DMG
        run: |
          ./Scripts/publish.sh dmg \
            --version "${{ steps.version.outputs.value }}" \
            --output dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
